<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111820"><meta name="description" content="小小夢魔：星幣迷夢，適合小學生的生活理財互動遊戲"><title>小小夢魔：星幣迷夢</title>
<style>
:root{color-scheme:dark;--ink:#f6f0e7;--muted:#b8b3ac;--gold:#e9bb68;--gold2:#f5d99a;--panel:#11191df2;--line:#d8bd8052;--sage:#a8b89e;font-family:"Noto Sans TC",system-ui,sans-serif;background:#111820;color:var(--ink);font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111820;overflow-x:hidden}.hud{height:78px;position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding:0 clamp(18px,4vw,68px);border-bottom:1px solid #fff1;background:linear-gradient(180deg,#10171ddd,#10171b80);backdrop-filter:blur(12px)}.brand{display:flex;gap:12px;align-items:center;color:inherit;text-decoration:none;width:max-content}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border:1px solid #e7c98288;border-radius:50%;color:var(--gold);font-size:20px;box-shadow:0 0 24px #e8b45330}.brand b,.brand small{display:block}.brand b{font-size:14px;letter-spacing:.13em}.brand small{font-size:9px;color:#c2b4a0;letter-spacing:.2em;margin-top:3px}.hud-center{display:grid;justify-items:center;gap:7px}.level-label{font-size:10px;letter-spacing:.2em;color:#e5d4b8}.progress-track{width:min(180px,70%);height:3px;background:#ffffff20;border-radius:4px;overflow:hidden}.progress-track i{display:block;width:0;height:100%;background:var(--gold);transition:width .45s}.hud-score{justify-self:end;text-align:right}.hud-score small{display:block;color:#c7bda9;font-size:9px;letter-spacing:.13em}.hud-score strong{font-size:21px;color:var(--gold2);font-weight:600}
.game{position:relative;min-height:calc(100svh - 78px);overflow:hidden;background:#151d21}.world{position:absolute;inset:0;background-image:linear-gradient(90deg,#0c131924 0%,#0b131966 45%,#091014e8 100%),url("./assets/level1.svg");background-size:cover;background-position:center;transition:background-image .6s}.vignette{position:absolute;inset:0;background:linear-gradient(0deg,#0c1217d9,transparent 34%,#1118203b),radial-gradient(ellipse at 31% 45%,transparent 10%,#11182066 75%)}.scene-title{position:absolute;left:clamp(24px,5vw,78px);top:clamp(42px,7vh,86px);max-width:365px;text-shadow:0 3px 24px #000}.eyebrow{margin:0;color:var(--gold);font-size:10px;letter-spacing:.22em}.scene-title h1{font-family:Georgia,"Noto Sans TC",serif;font-size:clamp(31px,4vw,53px);line-height:1.12;font-weight:500;margin:11px 0;letter-spacing:.035em}.scene-title p{font-size:12px;color:#e3d6c1;max-width:315px;line-height:1.85}.scene-hint{position:absolute;left:clamp(24px,5vw,78px);bottom:60px;color:#e6d2ad;font-size:11px;letter-spacing:.06em;text-shadow:0 2px 10px #000}.bottom-note{position:absolute;bottom:20px;left:clamp(24px,5vw,78px);display:flex;gap:9px;align-items:center;color:#d2c7b6;font-size:10px;text-shadow:0 1px 8px #000}.key-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.panel{position:absolute;right:clamp(18px,4.5vw,70px);top:50%;transform:translateY(-50%);width:min(445px,43vw);max-height:calc(100% - 36px);overflow:auto;padding:clamp(22px,2.3vw,34px);border:1px solid var(--line);border-radius:4px;background:linear-gradient(135deg,#11191df5,#11191deb);box-shadow:0 30px 100px #05090db5,0 0 0 1px #fff1 inset;backdrop-filter:blur(18px);z-index:1}.panel:before{content:"";position:absolute;top:0;left:26px;right:26px;height:1px;background:linear-gradient(90deg,transparent,#f0d394b0,transparent)}.panel h2{font-family:Georgia,"Noto Sans TC",serif;font-size:26px;line-height:1.3;font-weight:500;margin:10px 0}.lead{color:#d5cfc4;font-size:12px;line-height:1.8;margin:0 0 17px}.budget-line{display:flex;justify-content:space-between;align-items:center;color:#d5c5a7;font-size:10px;margin:0 0 8px}.budget-line strong{color:#f0d48f;font-size:13px}.meter{height:4px;background:#ffffff1e;margin-bottom:16px}.meter i{display:block;height:100%;background:linear-gradient(90deg,#af8650,#f0d48f);transition:width .3s}.item-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{min-height:78px;padding:11px 12px;border:1px solid #ffffff22;border-radius:3px;background:linear-gradient(145deg,#d3c6ac10,#ffffff04);text-align:left;cursor:pointer;transition:transform .16s,border-color .16s,background .16s;color:var(--ink)}.item:hover,.strategy:hover{transform:translateY(-2px);border-color:#dfbd7480}.item[aria-pressed=true],.strategy[aria-pressed=true]{border-color:#e5c37e;background:#e8c57518;box-shadow:inset 0 0 0 1px #e8c57518}.item-label{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600}.price{color:#eed090;font-size:11px}.item small{display:block;margin-top:7px;color:#aaa394;font-size:9px}.check{color:var(--gold)}.result-strip{display:flex;justify-content:space-between;margin:12px 0 15px;padding:10px 12px;background:#ffffff0a;border-left:2px solid var(--gold);font-size:10px;color:#c9c3b8}.result-strip b{color:#f1dbac;font-weight:600}.button{border:0;border-radius:2px;padding:13px 16px;cursor:pointer;transition:transform .15s,filter .15s;color:inherit}.button:hover{transform:translateY(-1px);filter:brightness(1.08)}.button:focus-visible,.item:focus-visible,.strategy:focus-visible{outline:2px solid #ffe4a7;outline-offset:3px}.primary{width:100%;background:linear-gradient(110deg,#c49a58,#ebcb83);color:#201d18;font-weight:700;letter-spacing:.05em;box-shadow:0 6px 20px #d7a85422}.quiet{background:#ffffff10;border:1px solid #ffffff20}.feedback{min-height:38px;margin:12px 0 0;color:#d9cda9;font-size:11px;line-height:1.65}.feedback.error{color:#f0a48d}.strategy-list{display:grid;gap:8px}.strategy{display:grid;grid-template-columns:27px 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;padding:12px;border:1px solid #ffffff23;background:#ffffff08;border-radius:3px;cursor:pointer;transition:.18s;color:var(--ink)}.orb{width:24px;height:24px;border:1px solid #c8a667;border-radius:50%;display:grid;place-items:center;color:#efcf87;font-size:10px}.strategy b{font-size:11px;font-weight:600}.strategy small{display:block;color:#aaa394;font-size:9px;margin-top:4px}.strategy strong{font-size:10px;color:#f0d491;white-space:nowrap}.callout{padding:11px 12px;border-left:2px solid #91a989;background:#91a98912;color:#d7dfcf;font-size:10px;line-height:1.7;margin:13px 0}.rule{border:0;border-top:1px solid #fff2;margin:15px 0}.chips{display:flex;gap:8px;margin:14px 0}.chip{padding:6px 9px;border:1px solid #eac87855;color:#e9cc87;font-size:9px;letter-spacing:.1em}.outcome{padding:14px;border:1px solid #eac87844;background:#f1d3910d;margin:14px 0}.outcome strong{display:block;font-family:Georgia,"Noto Sans TC",serif;font-size:20px;font-weight:500;margin-bottom:5px}.outcome span{color:#c8c1b4;font-size:10px;line-height:1.7}.progress-list{display:grid;gap:8px;margin:13px 0}.progress-card{padding:11px;border:1px solid #ffffff1e;background:#ffffff08}.progress-card b{display:flex;justify-content:space-between;font-size:11px}.progress-card small{display:block;margin-top:6px;color:#bdb5a7;font-size:10px;line-height:1.6}.intro-art{height:88px;display:grid;place-items:center;color:#efca7b;font-size:50px;text-shadow:0 0 30px #efca7b70}.help{position:fixed;right:18px;bottom:16px;z-index:3;width:32px;height:32px;border:1px solid #e9ca8055;border-radius:50%;background:#10181cba;color:#f0d18e;cursor:pointer}dialog{max-width:min(420px,calc(100% - 30px));padding:0;border:1px solid #dcc17e66;background:#11191d;color:var(--ink);box-shadow:0 20px 90px #000a}dialog::backdrop{background:#080d10c9;backdrop-filter:blur(5px)}.help-card{position:relative;padding:32px}.help-card p:not(.eyebrow){color:#c9c2b6;font-size:12px;line-height:1.8}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}@media(max-width:900px){.panel{width:min(430px,49vw);right:18px}.scene-title{max-width:290px}.hud{padding:0 20px}}@media(max-width:650px){.hud{height:68px;padding:0 14px}.brand-mark{width:32px;height:32px}.brand b{font-size:12px}.brand small{font-size:8px}.level-label{font-size:8px}.progress-track{width:62px}.hud-score strong{font-size:18px}.game{min-height:calc(100svh - 68px);padding:0 12px 20px;display:flex;align-items:flex-end}.world{background-position:34% center}.vignette{background:linear-gradient(0deg,#0c1217 0%,#0c1217df 48%,#11182016 100%)}.scene-title{top:20px;left:18px}.scene-title h1{font-size:28px;margin:5px 0}.scene-title p{font-size:10px;max-width:215px}.scene-title .eyebrow{font-size:8px}.panel{position:relative;inset:auto;transform:none;width:100%;max-height:calc(100svh - 230px);margin:205px 0 40px;padding:19px 16px;align-self:flex-end}.panel h2{font-size:22px}.lead{font-size:11px;margin-bottom:13px}.item{min-height:69px;padding:9px}.item-label{font-size:11px}.item small{font-size:8px}.bottom-note{left:18px;bottom:12px;font-size:9px}.help{right:12px;bottom:9px;width:28px;height:28px}}
</style></head>
<body>
<header class="hud"><a class="brand" href="./" aria-label="小小夢魔首頁"><span class="brand-mark">✦</span><span><b>小小夢魔</b><small>星幣迷夢</small></span></a><div class="hud-center"><span class="level-label" id="levelLabel">夢境尚未開始</span><span class="progress-track"><i id="progressBar"></i></span></div><div class="hud-score"><small>本關得分</small><strong id="scoreValue">—</strong></div></header>
<main class="game"><div class="world" id="world" role="img" aria-label="月光下的奇幻夢境場景"><div class="vignette"></div><div class="scene-title" id="sceneTitle"></div><div class="scene-hint" id="sceneHint"></div></div><section class="panel" id="panel" aria-live="polite"></section><div class="bottom-note"><span class="key-dot"></span><span id="keyStatus">找到兩把鑰匙，帶著新本領醒來</span></div></main>
<dialog id="helpDialog"><form method="dialog" class="help-card"><button class="quiet" style="float:right" aria-label="關閉">×</button><p class="eyebrow">遊戲小提示</p><h2>每一枚星幣都有去處</h2><p>在星幣小屋練習分辨需要與想要；到夢境果園，看看分散選擇如何面對不同風險。這是學習模擬，不涉及真實金錢或投資建議。</p><button class="button primary">我知道了</button></form></dialog><button class="help" id="helpButton" type="button" aria-label="遊戲提示">?</button>
<script>
const $=s=>document.querySelector(s),world=$("#world"),panel=$("#panel");
const state={level:-1,selected:new Set(),attempts:[0,0],scores:[0,0]};
const names=["星幣小屋","夢境果園"];
const items=[["早餐",8,"必需品"],["雨衣",10,"必需品"],["故事書",7,"必需品"],["機器人",12,"想要的物品"]];
const plans=[["全部放進星星園","20 枚集中在一個園圃",[20,0,0]],["雲樹園＋星果園","12 枚＋8 枚，分在兩處",[12,8,0]],["三處均分","7 枚＋7 枚＋6 枚，分在三處",[7,7,6]]];
function scene(n){let img=n===1?"level2.svg":"level1.svg";world.style.backgroundImage='linear-gradient(90deg,#0c131924 0%,#0b131966 45%,#091014e8 100%),url("./assets/'+img+'")';$("#levelLabel").textContent=n<0?"夢境尚未開始":n===2?"夢境完成":"第 "+(n+1)+" 關　"+names[n];$("#progressBar").style.width=n<0?"0%":n===0?"25%":n===1?"70%":"100%";$("#scoreValue").textContent=n<0?"—":n<2?(state.scores[n]||Math.max(40,100-state.attempts[n]*20)):"—";$("#sceneTitle").innerHTML=n<0?"":n===0?'<span class="eyebrow">第一關｜夢境入口</span><h1>星幣小屋</h1><p>巨大的古屋藏著一把鑰匙。先安排今天要用的星幣，再為明天留下一點希望。</p>':'<span class="eyebrow">第二關｜月光果園</span><h1>分岔的星徑</h1><p>夢境的風會改變方向。把星幣放在哪裡，才不會被一場風暴全部吹走？</p>';$("#sceneHint").textContent=n===0?"桌上有一冊未完成的帳本，暖光正照著空白的一頁。":n===1?"三座果園在月光下閃爍，遠處的雲層正在移動。":""}
function intro(){scene(-1);panel.innerHTML='<p class="eyebrow">一段星幣與夢境的旅程</p><h2>小小夢魔：星幣迷夢</h2><div class="intro-art" aria-hidden="true">✦</div><p class="lead">月光古屋有兩把 KEY。用星幣安排生活需要，再走進會起風的夢境果園，學習分散風險。</p><div class="outcome"><strong>兩關 · 兩個互動 · 一段進步旅程</strong><span>適合小學生的生活理財學習遊戲。所有星幣皆為虛構，不涉及真實金錢或投資建議。</span></div><button class="button primary" id="startButton">進入夢境　→</button><button class="button quiet" id="helpOpen" style="width:100%;margin-top:8px">查看遊戲提示</button>';$("#startButton").onclick=start;$("#helpOpen").onclick=()=>$("#helpDialog").showModal()}
function start(){state.level=0;state.selected.clear();state.attempts=[0,0];state.scores=[0,0];$("#keyStatus").textContent="找到兩把鑰匙，帶著新本領醒來";scene(0);level1()}
function stats(){let chosen=[...state.selected].map(i=>items[i]);let spent=chosen.reduce((n,x)=>n+x[1],0);return {chosen,spent,left:30-spent}}
function level1(){let v=stats();let cards=items.map((x,i)=>'<button class="item" data-i="'+i+'" aria-pressed="'+state.selected.has(i)+'"><span class="item-label"><span>'+x[0]+'</span><span class="price">'+x[1]+' 枚</span></span><small>'+x[2]+' <span class="check">'+(state.selected.has(i)?"・已選":"")+'</span></small></button>').join("");panel.innerHTML='<p class="eyebrow">互動單元 01 · 需要與想要</p><h2>替星幣找好位置</h2><p class="lead">你有 <b>30 枚星幣</b>。先準備好必需品，並至少留下 5 枚存起來。</p><div class="budget-line"><span>目前花費</span><strong>'+v.spent+' / 30 枚</strong></div><div class="meter"><i style="width:'+Math.max(0,Math.min(100,v.spent/30*100))+'%"></i></div><div class="item-grid">'+cards+'</div><div class="result-strip"><span>已選 '+v.chosen.length+' 項</span><b>剩下 '+v.left+' 枚</b></div><button class="button primary" id="submit">提交預算　・　取得 KEY</button><p class="feedback" id="feedback">'+(state.attempts[0]?"再看看哪些物品是日常必需，留下存款也很重要。":"選好後提交答案；答錯可以再試一次。")+'</p>';panel.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{let i=Number(b.dataset.i);state.selected.has(i)?state.selected.delete(i):state.selected.add(i);level1();panel.querySelector("[data-i="+i+"]").focus()});$("#submit").onclick=submit1;$("#scoreValue").textContent=state.scores[0]||Math.max(40,100-state.attempts[0]*20)}
function submit1(){state.attempts[0]++;let v=stats();let ok=state.selected.size===3&&state.selected.has(0)&&state.selected.has(1)&&state.selected.has(2)&&v.spent===25&&v.left>=5;if(!ok){let f=$("#feedback");f.className="feedback error";f.textContent=v.spent>30?"星幣不夠用了。回頭檢查必需品與想要物品的取捨。":"早餐、雨衣和故事書是這個情境的必需品；也要記得留下一些存款。";return}state.scores[0]=Math.max(40,100-(state.attempts[0]-1)*20);$("#keyStatus").textContent="已取得第 1 把 KEY　・　下一站：月光果園";panel.innerHTML='<p class="eyebrow">星幣小屋 · 解題成功</p><h2>鑰匙照亮了古屋</h2><div class="intro-art">✦</div><div class="outcome"><strong>你花了 25，留下 5 枚</strong><span>先照顧日常需要，再把餘額存下來，預算就有了方向。</span></div><div class="chips"><span class="chip">KEY 01</span><span class="chip">本關 '+state.scores[0]+' 分</span></div><button class="button primary" id="next">前往夢境果園　→</button>';$("#next").onclick=()=>{state.level=1;state.selected.clear();scene(1);level2()};$("#scoreValue").textContent=state.scores[0]}
function level2(){let rows=plans.map((p,i)=>'<button class="strategy" data-plan="'+i+'" aria-pressed="'+state.selected.has(i)+'"><span class="orb">'+(i+1)+'</span><span><b>'+p[0]+'</b><small>'+p[1]+'</small></span><strong>'+p[2].filter(x=>x>0).length+' 座園圃</strong></button>').join("");panel.innerHTML='<p class="eyebrow">互動單元 02 · 投資與風險</p><h2>把星幣分到不同園圃</h2><p class="lead">你有 <b>20 枚星幣</b>。夢境風暴只會影響一座園圃；選一種分配方式，看看哪種較不依賴單一地方。</p><div class="budget-line"><span>可分配星幣</span><strong>20 枚</strong></div><hr class="rule"><div class="strategy-list">'+rows+'</div><div class="callout">分散投資不能保證不會損失，但能降低單一事件影響全部星幣的機會。</div><button class="button primary" id="submit2">確認分配　・　取得 KEY</button><p class="feedback" id="feedback">'+(state.attempts[1]?"想想看：如果風暴只吹到一處，其他園圃能否留下星幣？":"選擇一種分配方式，再確認答案。")+'</p>';panel.querySelectorAll("[data-plan]").forEach(b=>b.onclick=()=>{let i=Number(b.dataset.plan);state.selected.clear();state.selected.add(i);level2();panel.querySelector("[data-plan="+i+"]").focus()});$("#submit2").onclick=submit2;$("#scoreValue").textContent=state.scores[1]||Math.max(40,100-state.attempts[1]*20)}
function submit2(){state.attempts[1]++;let i=[...state.selected][0];if(i!==1&&i!==2){let f=$("#feedback");f.className="feedback error";f.textContent="全部放在一處，遇到那裡的風暴時會一起受影響。試試分到兩座以上的園圃。";return}state.scores[1]=Math.max(40,100-(state.attempts[1]-1)*20);$("#keyStatus").textContent="兩把 KEY 都找到了　・　夢境正在變亮";finish()}
function finish(){scene(2);let total=state.scores[0]+state.scores[1],avg=Math.round(total/2);panel.innerHTML='<p class="eyebrow">夢境旅程完成 · 進步成果</p><h2>你帶著新的理財本領醒來</h2><div class="chips"><span class="chip">KEY 01　'+state.scores[0]+' 分</span><span class="chip">KEY 02　'+state.scores[1]+' 分</span></div><div class="outcome"><strong>總得分　'+total+' / 200</strong><span>兩關平均 '+avg+' 分　·　完成 2 / 2 個互動單元</span></div><div class="progress-list"><div class="progress-card"><b><span>需要與想要</span><span>'+state.scores[0]+' 分</span></b><small>你安排了早餐、雨衣和故事書，並留下 5 枚星幣。</small></div><div class="progress-card"><b><span>分散投資風險</span><span>'+state.scores[1]+' 分</span></b><small>你把星幣放進不只一座園圃，降低單一風暴的影響。</small></div></div><p class="feedback">解題足跡：從規劃日常預算，到思考分散風險。這是遊戲表現紀錄，不是正式學習測驗。</p><button class="button primary" id="restart">再玩一次</button>';$("#restart").onclick=start;$("#scoreValue").textContent=avg}
$("#helpButton").onclick=()=>$("#helpDialog").showModal();intro();
</script></body></html>
