<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#111f2a"/><stop offset=".55" stop-color="#29414a"/><stop offset="1" stop-color="#1a2928"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#314039"/><stop offset="1" stop-color="#141d1c"/></linearGradient>
 <radialGradient id="moon"><stop stop-color="#f5e2ad"/><stop offset=".72" stop-color="#c9c89f"/><stop offset="1" stop-color="#91a5a0"/></radialGradient>
